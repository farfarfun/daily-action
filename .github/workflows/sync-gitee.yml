name: Mirror to Gitee

on:
  push:
  schedule:
    - cron: "17 */2 * * *" # 每 2 小时一次（Asia/Shanghai 各整点+8 后的 17 分）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-gitee
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    # 129+ 个仓库全量 force-push 镜像，个别大仓库（如 fork 来的 chinese-poetry、
    # funinstall）单仓库重试三次就要吃掉 90 分钟，原来的 30 分钟必然跑不完就被
    # 平台超时杀掉，每次都以 failure/cancelled 结束。放宽到 180 分钟留够余量。
    timeout-minutes: 180
    steps:
      - name: Mirror farfarfun public repositories to Gitee
        # Pinned to a commit SHA, not @master: this third-party action handles
        # the Gitee SSH private key and token, so a compromised upstream
        # branch could exfiltrate both credentials on the next run.
        # SHA corresponds to v1.5 (same version farfarfun/fundeploy pins to).
        uses: Yikun/hub-mirror-action@ec47170fa9d126a4bee5a1ab9359845bb1395248 # v1.5
        env:
          # 这个 action 容器内 Python 的 stdout 默认是全缓冲的（非 tty），日志
          # 会攒很久才一次性吐出来，看起来像卡住，实际可能只是在正常处理但
          # 看不到进度。设成无缓冲方便判断是真卡死还是只是没刷新。
          PYTHONUNBUFFERED: "1"
        with:
          src: github/farfarfun
          dst: gitee/farfarfun
          dst_key: ${{ secrets.GITEE_RSA_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          account_type: org
          force_update: true
          # chinese-poetry 是 fork 来的第三方数据集（~237MB，非 farfarfun 原创
          # 内容），push 到 Gitee 经常单次超时、重试 3 次仍失败，白白拖慢整个
          # job 且不产出有价值的镜像，直接排除。
          black_list: chinese-poetry
          # 这个 action 没有 src_token 这个输入（已核对 action.yml/README），
          # 没有任何凭证时列仓库只能走匿名 API，因此天然只能看到公开仓库，
          # 私有仓库不会被同步到 Gitee。
