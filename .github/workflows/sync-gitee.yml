name: Mirror to Gitee

on:
  push:
  schedule:
    - cron: "10 16 * * *" # 00:10 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror farfarfun public repositories to Gitee
        uses: Yikun/hub-mirror-action@master
        with:
          src: github/farfarfun
          dst: gitee/farfarfun
          dst_key: ${{ secrets.GITEE_RSA_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          account_type: org
          force_update: true
          # Only public repos are visible without a src_token, so private
          # repositories are never mirrored to Gitee.
